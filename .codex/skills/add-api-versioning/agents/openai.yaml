interface:
  display_name: "Add Api Versioning"
  short_description: "Establish an explicit URL-path-based API versioning strategy for a Quarkus REST API — moves existing endpoints to a versioned base path (alr"
  default_prompt: "Use $add-api-versioning to establish an explicit URL-path-based API versioning strategy for a Quarkus REST API — moves existing endpoints to a versioned base path (already /api/v1 in this repo), introduces a Resource-per-version convention, generates a DeprecationFilter that adds RFC 8594 Sunset and Deprecation headers when an endpoint is marked @Deprecated(since=\"v1\", sunset=\"2026-12-01\"), splits OpenAPI documentation per version, and writes a docs/api-versioning.md policy with deprecation lifecycle and SemVer mapping. Use whenever the user asks for API versioning, \"how do I add v2\", deprecation strategy, breaking change roadmap, or wants to introduce a new version of an existing endpoint without breaking current consumers."
