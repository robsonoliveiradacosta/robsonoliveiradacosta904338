## Hard rules

- **Don't recommend `@Transactional` on every public method**. Most reads don't need it; the cost is real (dirty checking on every loaded entity).
- **Don't recommend `Propagation.MANDATORY` / `Propagation.NEVER`** as a fix for self-call issues — that's just throwing instead of misbehaving. The actual fix is to inject the bean into itself (`@Inject MyService self`) or restructure.
- **Don't flag `@Transactional` on a method that calls `@Transactional` methods on different beans** — that's exactly when propagation matters and the existing setup is correct.
- **Don't trust grep alone for "no @Transactional on persist".** Class-level `@Transactional` covers all methods. Read the class header before flagging.
- **Don't suggest disabling auto-commit globally** to "force everything into a transaction". That's a config bomb.
- **Don't propose long-running transactions** as a way to keep data consistent. Split into smaller transactions + idempotent retries + outbox pattern (separate skill).

## Quick reference: when in doubt

| Method does | Needs `@Transactional`? |
|---|---|
| Reads only, single repository call | No |
| Reads only, multiple calls | Optional (`SUPPORTS`) for connection reuse |
| Writes (persist/merge/delete) | **Yes** |
| Calls another `@Transactional` service from a different bean | No — propagation does it |
| Calls another `@Transactional` method on `this` | The inner annotation **does not apply** — restructure |
| Native `@Modifying` query | **Yes** |
| External HTTP / object storage call | No — keep tx narrow, fetch first |
| Scheduled job that needs all-or-nothing | **Yes** at the entry point |

## Style

Snippet + line + the runtime symptom (`TransactionRequiredException`, pool exhaustion, etc.) + smallest fix. Confidence percent per finding. The quick-reference table is reusable so the report can paste it inline if relevant.

